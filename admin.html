<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Jüterblog</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 860px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 { font-size: 22px; }
  #login-screen {
    max-width: 320px;
    margin: 100px auto;
    text-align: center;
  }
  #login-screen input {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    box-sizing: border-box;
    font-size: 15px;
  }
  #login-screen button, .btn {
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
  }
  #login-screen button { width: 100%; }
  .btn:hover { background: #f0f0f0; }
  .btn-primary { background: #222; color: #fff; border-color: #222; }
  .btn-primary:hover { background: #000; }
  .btn-danger { color: #b00020; border-color: #eeb; }
  #error { color: #b00020; font-size: 14px; }
  .tabs { margin-bottom: 16px; }
  .tabs button {
    margin-right: 6px;
    padding: 6px 12px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .tabs button.active { background: #222; color: #fff; border-color: #222; }
  .card {
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .card-top strong { font-size: 16px; }
  .meta { font-size: 12px; color: #888; white-space: nowrap; }
  .details { color: #555; font-size: 14px; margin: 6px 0; }
  .status-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eee;
    margin-right: 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-approved { background: #d6f5c6; }
  .status-new { background: #dcf4a2; }
  .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  form.edit label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    margin-bottom: 2px;
  }
  form.edit input[type="text"],
  form.edit input[type="date"],
  form.edit input[type="time"],
  form.edit textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checkline { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; }
  .form-actions { margin-top: 12px; }
  #loading, #empty { color: #888; font-size: 14px; }

  .main-nav { margin-bottom: 20px; border-bottom: 1px solid #e2e2e2; }
  .main-nav button {
    padding: 8px 4px;
    margin-right: 20px;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    cursor: pointer;
    font-size: 14px;
    color: #888;
  }
  .main-nav button.active { color: #222; border-bottom-color: #43b262; font-weight: 600; }

  .nl-event-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .nl-event-row input[type="checkbox"] { margin-top: 3px; }
  .nl-event-row .nl-event-info strong { font-size: 14px; }
  .nl-event-row .nl-event-meta { font-size: 12px; color: #888; }
  .nl-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .nl-toolbar .btn-link { background: none; border: none; color: #0055a4; cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
  #newsletter-output { margin-top: 20px; }
  #newsletter-html {
    width: 100%;
    box-sizing: border-box;
    height: 160px;
    font-family: monospace;
    font-size: 12px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  #newsletter-preview {
    width: 100%;
    height: 700px;
    border: 1px solid #e2e2e2;
    border-radius: 10px;
    margin-top: 10px;
  }
  #copy-confirm { color: #43b262; font-size: 13px; margin-left: 8px; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Admin-Login</h2>
  <input id="pw-input" type="password" placeholder="Passwort" />
  <button id="login-btn">Einloggen</button>
  <p id="error"></p>
</div>

<div id="app" style="display:none;">
  <div class="main-nav">
    <button data-view="events" class="active">Events</button>
    <button data-view="newsletter">Newsletter</button>
  </div>

  <div id="events-view">
    <h1>Event-Einreichungen</h1>
    <div class="tabs">
      <button data-filter="pending" class="active">Ausstehend</button>
      <button data-filter="approved">Freigegeben</button>
      <button data-filter="all">Alle</button>
    </div>
    <p id="loading" style="display:none;">Lädt…</p>
    <p id="empty" style="display:none;">Keine Events in dieser Ansicht.</p>
    <div id="list"></div>
  </div>

  <div id="newsletter-view" style="display:none;">
    <h1>Newsletter erstellen</h1>
    <p class="details">Wähle die freigegebenen Events aus, die im Newsletter erscheinen sollen.</p>
    <div class="nl-toolbar">
      <div>
        <button class="btn-link" id="nl-select-all">Alle auswählen</button> ·
        <button class="btn-link" id="nl-select-none">Auswahl aufheben</button>
      </div>
      <span class="meta" id="nl-count"></span>
    </div>
    <div id="nl-event-list"></div>
    <p id="nl-empty" class="details" style="display:none;">Keine freigegebenen Events vorhanden.</p>
    <div class="form-actions">
      <button class="btn btn-primary" id="nl-generate">Newsletter generieren</button>
    </div>
    <div id="newsletter-output" style="display:none;">
      <div class="nl-toolbar">
        <strong style="font-size:14px;">Event-Liste (HTML-Block für Brevo)</strong>
        <span>
          <button class="btn" id="nl-copy">HTML kopieren</button>
          <span id="copy-confirm" style="display:none;">Kopiert!</span>
        </span>
      </div>
      <textarea id="newsletter-html" readonly></textarea>
      <p class="details" style="margin-top:14px;">Vorschau:</p>
      <iframe id="newsletter-preview"></iframe>
    </div>
  </div>
</div>

<script>
const API = '/api/admin/events';
let password = sessionStorage.getItem('admin_pw') || '';
let events = [];
let filter = 'pending';
let editingId = null;

const loginScreen = document.getElementById('login-screen');
const app = document.getElementById('app');
const pwInput = document.getElementById('pw-input');
const errorEl = document.getElementById('error');
const listEl = document.getElementById('list');
const loadingEl = document.getElementById('loading');
const emptyEl = document.getElementById('empty');
const eventsView = document.getElementById('events-view');
const newsletterView = document.getElementById('newsletter-view');

document.querySelectorAll('.main-nav button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.main-nav button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    eventsView.style.display = view === 'events' ? 'block' : 'none';
    newsletterView.style.display = view === 'newsletter' ? 'block' : 'none';
    if (view === 'newsletter') renderNewsletterSelect();
  });
});

document.getElementById('login-btn').addEventListener('click', () => {
  password = pwInput.value;
  sessionStorage.setItem('admin_pw', password);
  init();
});
pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });

document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

async function apiCall(method, body) {
  const res = await fetch(API, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-password': password,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    sessionStorage.removeItem('admin_pw');
    loginScreen.style.display = 'block';
    app.style.display = 'none';
    errorEl.textContent = 'Passwort abgelehnt — bitte erneut versuchen.';
    throw new Error('unauthorized');
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    data = { error: `Serverfehler (${res.status})` };
  }
  if (!res.ok && !data.error) {
    data.error = `Fehler ${res.status}: ${res.statusText}`;
  }
  return data;
}

async function init() {
  loginScreen.style.display = 'none';
  app.style.display = 'block';
  loadingEl.style.display = 'block';
  emptyEl.textContent = 'Keine Events in dieser Ansicht.';
  editingId = null;
  try {
    const data = await apiCall('GET');
    if (data.error) {
      loadingEl.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.textContent = 'Fehler: ' + data.error;
      events = [];
      return;
    }
    events = data.events || [];
  } catch (e) {
    return;
  }
  loadingEl.style.display = 'none';
  render();
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('de-DE');
}

function isDraftId(id) {
  return typeof id === 'string' && id.startsWith('draft-');
}

function render() {
  const visible = filter === 'all' ? events : events.filter((e) => e.status === filter);
  listEl.innerHTML = '';
  emptyEl.style.display = visible.length === 0 ? 'block' : 'none';

  visible.forEach((ev) => {
    const card = document.createElement('div');
    card.className = 'card';

    if (editingId === ev.id) {
      card.innerHTML = editFormHtml(ev);
      listEl.appendChild(card);
      wireEditForm(card, ev);
      return;
    }

    const dateRange = ev.event_end_date && ev.event_end_date !== ev.event_date
      ? `${fmtDate(ev.event_date)} – ${fmtDate(ev.event_end_date)}`
      : fmtDate(ev.event_date);

    card.innerHTML = `
      <div class="card-top">
        <strong>${escapeHtml(ev.event_name || '(ohne Titel)')}</strong>
        <span class="meta">eingereicht ${new Date(ev.created_at).toLocaleString('de-DE')}</span>
      </div>
      <div class="details">
        ${dateRange}${ev.start_time ? ' · ' + ev.start_time.slice(0,5) : ''}
        ${ev.location ? ' · ' + escapeHtml(ev.location) : ''}
        ${ev.categories && ev.categories.length ? ' · ' + escapeHtml(ev.categories.join(', ')) : ''}
      </div>
      <div class="details">${escapeHtml(ev.description || '')}</div>
      <div class="actions">
        <span class="status-pill ${ev.status === 'approved' ? 'status-approved' : ''}">${escapeHtml(ev.status || '')}</span>
        <button class="btn" data-action="edit">Bearbeiten</button>
        <button class="btn" data-action="duplicate">Duplizieren</button>
        ${ev.status !== 'approved'
          ? '<button class="btn btn-primary" data-action="approve">Freigeben</button>'
          : '<button class="btn" data-action="unapprove">Zurückziehen</button>'}
        <button class="btn btn-danger" data-action="delete">Löschen</button>
      </div>
    `;

    card.querySelector('[data-action="edit"]').addEventListener('click', () => {
      editingId = ev.id;
      render();
    });
    card.querySelector('[data-action="duplicate"]').addEventListener('click', () => {
      const draft = {
        ...ev,
        id: 'draft-' + Date.now(),
        status: 'pending',
        created_at: new Date().toISOString(),
      };
      const idx = events.findIndex((e) => e.id === ev.id);
      events.splice(idx + 1, 0, draft);
      editingId = draft.id;
      if (filter !== 'all' && filter !== 'pending') {
        filter = 'pending';
        document.querySelectorAll('.tabs button').forEach((b) => {
          b.classList.toggle('active', b.dataset.filter === 'pending');
        });
      }
      render();
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', async () => {
      if (!confirm('Dieses Event endgültig löschen?')) return;
      const data = await apiCall('DELETE', { id: ev.id });
      if (data.error) { alert('Fehler beim Löschen: ' + data.error); return; }
      await init();
    });
    const approveBtn = card.querySelector('[data-action="approve"]');
    if (approveBtn) approveBtn.addEventListener('click', async () => {
      const data = await apiCall('PATCH', { id: ev.id, status: 'approved' });
      if (data.error) { alert('Fehler: ' + data.error); return; }
      await init();
    });
    const unapproveBtn = card.querySelector('[data-action="unapprove"]');
    if (unapproveBtn) unapproveBtn.addEventListener('click', async () => {
      const data = await apiCall('PATCH', { id: ev.id, status: 'pending' });
      if (data.error) { alert('Fehler: ' + data.error); return; }
      await init();
    });

    listEl.appendChild(card);
  });
}

function editFormHtml(ev) {
  const isDraft = isDraftId(ev.id);
  return `
    <form class="edit">
      ${isDraft ? '<span class="status-pill status-new">Neue Kopie — noch nicht gespeichert</span>' : ''}
      <label>Name der Veranstaltung</label>
      <input type="text" name="event_name" value="${attr(ev.event_name)}" />

      <div class="row2">
        <div>
          <label>Kategorien (Komma-getrennt)</label>
          <input type="text" name="categories" value="${attr((ev.categories || []).join(', '))}" />
        </div>
        <div>
          <label>Ort</label>
          <input type="text" name="location" value="${attr(ev.location)}" />
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Datum</label>
          <input type="date" name="event_date" value="${attr(ev.event_date)}" />
        </div>
        <div>
          <label>Beginn</label>
          <input type="time" name="start_time" value="${attr((ev.start_time||'').slice(0,5))}" />
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Enddatum (falls mehrtägig)</label>
          <input type="date" name="event_end_date" value="${attr(ev.event_end_date)}" />
        </div>
        <div>
          <label>Ende</label>
          <input type="time" name="end_time" value="${attr((ev.end_time||'').slice(0,5))}" />
        </div>
      </div>

      <label>Adresse</label>
      <input type="text" name="address" value="${attr(ev.address)}" />

      <label>Beschreibung</label>
      <textarea name="description" rows="4">${escapeHtml(ev.description || '')}</textarea>

      <label>Link</label>
      <input type="text" name="link" value="${attr(ev.link)}" />

      <div class="row2">
        <div>
          <label>Name der einreichenden Person</label>
          <input type="text" name="submitter_name" value="${attr(ev.submitter_name)}" />
        </div>
        <div>
          <label>E-Mail</label>
          <input type="text" name="submitter_email" value="${attr(ev.submitter_email)}" />
        </div>
      </div>

      <div class="checkline">
        <input type="checkbox" name="is_free" ${ev.is_free ? 'checked' : ''} id="is_free_${ev.id}" />
        <label for="is_free_${ev.id}" style="margin:0;">Kostenlos</label>
      </div>
      <div class="checkline">
        <input type="checkbox" name="is_barrierfrei" ${ev.is_barrierfrei ? 'checked' : ''} id="is_barrierfrei_${ev.id}" />
        <label for="is_barrierfrei_${ev.id}" style="margin:0;">Barrierefrei</label>
      </div>

      <label>Barrierefreiheit — Hinweis</label>
      <input type="text" name="barrierfrei_info" value="${attr(ev.barrierfrei_info)}" />

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">${isDraft ? 'Als neues Event speichern' : 'Speichern'}</button>
        <button type="button" class="btn" data-action="cancel">Abbrechen</button>
      </div>
    </form>
  `;
}

function wireEditForm(card, ev) {
  const form = card.querySelector('form.edit');
  const isDraft = isDraftId(ev.id);

  card.querySelector('[data-action="cancel"]').addEventListener('click', () => {
    if (isDraft) {
      events = events.filter((e) => e.id !== ev.id);
    }
    editingId = null;
    render();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {
      event_name: fd.get('event_name'),
      categories: fd.get('categories').split(',').map(s => s.trim()).filter(Boolean),
      location: fd.get('location'),
      event_date: fd.get('event_date') || null,
      start_time: fd.get('start_time') || null,
      event_end_date: fd.get('event_end_date') || null,
      end_time: fd.get('end_time') || null,
      address: fd.get('address'),
      description: fd.get('description'),
      link: fd.get('link'),
      submitter_name: fd.get('submitter_name'),
      submitter_email: fd.get('submitter_email'),
      is_free: fd.get('is_free') === 'on',
      is_barrierfrei: fd.get('is_barrierfrei') === 'on',
      barrierfrei_info: fd.get('barrierfrei_info'),
    };
    let data;
    if (isDraft) {
      body.status = 'pending';
      data = await apiCall('POST', body);
    } else {
      body.id = ev.id;
      data = await apiCall('PATCH', body);
    }
    if (data.error) {
      alert('Fehler beim Speichern: ' + data.error);
      return;
    }
    editingId = null;
    await init();
  });
}

// ---------- Newsletter ----------

const DE_MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function getUpcomingMonthBounds() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth(); // 0-indexed current month
  const nextMonth = m === 11 ? 0 : m + 1;
  const nextYear = m === 11 ? y + 1 : y;
  const start = new Date(nextYear, nextMonth, 1);
  const end = new Date(nextYear, nextMonth + 1, 0);
  const toIso = (d) => d.toISOString().slice(0, 10);
  return { start: toIso(start), end: toIso(end), label: `${DE_MONTHS[nextMonth]} ${nextYear}` };
}

function renderNewsletterSelect() {
  const listEl = document.getElementById('nl-event-list');
  const emptyEl = document.getElementById('nl-empty');
  const approved = events
    .filter((e) => e.status === 'approved')
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));

  listEl.innerHTML = '';
  emptyEl.style.display = approved.length === 0 ? 'block' : 'none';

  const bounds = getUpcomingMonthBounds();

  approved.forEach((ev) => {
    const inUpcomingMonth = ev.event_date >= bounds.start && ev.event_date <= bounds.end;
    const row = document.createElement('div');
    row.className = 'nl-event-row';
    row.innerHTML = `
      <input type="checkbox" data-id="${attr(ev.id)}" ${inUpcomingMonth ? 'checked' : ''} />
      <div class="nl-event-info">
        <strong>${escapeHtml(ev.event_name || '(ohne Titel)')}</strong><br/>
        <span class="nl-event-meta">${fmtDate(ev.event_date)}${ev.location ? ' · ' + escapeHtml(ev.location) : ''}</span>
      </div>
    `;
    row.querySelector('input').addEventListener('change', updateNlCount);
    listEl.appendChild(row);
  });

  updateNlCount();
  document.getElementById('newsletter-output').style.display = 'none';
}

function updateNlCount() {
  const total = document.querySelectorAll('#nl-event-list input[type="checkbox"]').length;
  const checked = document.querySelectorAll('#nl-event-list input[type="checkbox"]:checked').length;
  document.getElementById('nl-count').textContent = `${checked} von ${total} ausgewählt`;
}

document.getElementById('nl-select-all').addEventListener('click', () => {
  document.querySelectorAll('#nl-event-list input[type="checkbox"]').forEach((cb) => cb.checked = true);
  updateNlCount();
});
document.getElementById('nl-select-none').addEventListener('click', () => {
  document.querySelectorAll('#nl-event-list input[type="checkbox"]').forEach((cb) => cb.checked = false);
  updateNlCount();
});

document.getElementById('nl-generate').addEventListener('click', () => {
  const checkedIds = Array.from(document.querySelectorAll('#nl-event-list input[type="checkbox"]:checked'))
    .map((cb) => cb.dataset.id);
  const selected = events
    .filter((e) => checkedIds.includes(e.id))
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));

  if (selected.length === 0) {
    alert('Bitte mindestens ein Event auswählen.');
    return;
  }

  const html = generateNewsletterHtml(selected);

  document.getElementById('newsletter-html').value = html;
  document.getElementById('newsletter-preview').srcdoc =
    `<body style="margin:0; padding:20px; background:#fdfdfd;">${html}</body>`;
  document.getElementById('newsletter-output').style.display = 'block';
  document.getElementById('newsletter-output').scrollIntoView({ behavior: 'smooth' });
});

document.getElementById('nl-copy').addEventListener('click', async () => {
  const textarea = document.getElementById('newsletter-html');
  const confirmEl = document.getElementById('copy-confirm');
  try {
    await navigator.clipboard.writeText(textarea.value);
  } catch (e) {
    textarea.select();
    document.execCommand('copy');
  }
  confirmEl.style.display = 'inline';
  setTimeout(() => { confirmEl.style.display = 'none'; }, 2000);
});

function nlEventCardHtml(ev) {
  const dateRange = ev.event_end_date && ev.event_end_date !== ev.event_date
    ? `${fmtDate(ev.event_date)} – ${fmtDate(ev.event_end_date)}`
    : fmtDate(ev.event_date) + (ev.start_time ? ', ' + ev.start_time.slice(0, 5) + ' Uhr' : '');

  const tags = [];
  if (ev.is_free) tags.push('Kostenlos');
  if (ev.is_barrierfrei) tags.push('Barrierefrei');

  const link = ev.link || '';
  const titleHtml = link
    ? `<a href="${attr(link)}" style="color:#0055a4; text-decoration:none;">${escapeHtml(ev.event_name || '')}</a>`
    : escapeHtml(ev.event_name || '');

  const FS = 'font-family:Verdana, Geneva, sans-serif; font-size:16px;';

  const parts = [];
  parts.push(`<p style="margin:0 0 2px 0; ${FS} font-weight:bold; color:#0055a4;">${escapeHtml(dateRange)}</p>`);
  parts.push(`<p style="margin:0 0 2px 0; ${FS} font-weight:bold; color:#0055a4;">${titleHtml}</p>`);
  if (ev.categories && ev.categories.length) {
    parts.push(`<p style="margin:0 0 2px 0; ${FS} font-style:italic; color:#0055a4;">${escapeHtml(ev.categories.join(', '))}</p>`);
  }
  if (tags.length) {
    parts.push(`<p style="margin:0 0 2px 0; ${FS} font-weight:bold; color:#0055a4;">${escapeHtml(tags.join(' – '))}</p>`);
  }
  if (link) {
    parts.push(`<p style="margin:0 0 18px 0; ${FS}"><a href="${attr(link)}" style="color:#0055a4; font-weight:bold; text-decoration:none;">Mehr Info</a></p>`);
  } else {
    parts.push(`<p style="margin:0 0 18px 0;">&nbsp;</p>`);
  }
  return parts.join('');
}

function generateNewsletterHtml(selected) {
  return selected.map(nlEventCardHtml).join('').trim();
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function attr(str) { return escapeHtml(str); }

// Auto-login if a password was already saved this session
if (password) {
  init();
}
</script>
