<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jüterblog</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="header-left">
    <img src="wordmark.png" alt="Jüterblog" class="logo-img">
  </a>
  <div class="header-right">
    <img src="logo-mark.png" alt="" class="logo-mark">
    <a href="submit.html" class="btn btn-primary">Event einreichen</a>
  </div>
</header>

<section class="hero">
  <p>Kuratierter Eventkalender für Jüterbog und Umgebung.</p>
</section>

<nav class="filters" id="filters">
  <button class="chip active" data-category="all">All</button>
</nav>

<main class="event-list" id="event-list">
  <!-- Events load here -->
</main>

<div class="empty-state" id="empty-state" style="display:none">
  <span class="emoji">🗓️</span>
  <p>Für diesen Filter gibt es noch keine Events. Schau bald wieder vorbei oder <a href="submit.html" style="color:var(--text); font-weight:700;">reiche als Erste:r ein Event ein</a>.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="categories.js"></script>
<script src="main.js"></script>
</body>
</html>
