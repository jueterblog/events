<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit an Event — Local Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="site-logo"><span class="dot"></span> Local Events</a>
  <a href="index.html" class="btn btn-ghost">← Back to events</a>
</header>

<section class="hero">
  <h1>Submit an event</h1>
  <p>Tell us what's happening. We review every submission before it goes live — usually within a few days.</p>
</section>

<div class="form-wrap">
  <div class="form-card">
    <form id="event-form">

      <label for="event_name">Event name</label>
      <input type="text" id="event_name" required maxlength="120">

      <label>Categories <span class="hint">(choose up to 3)</span></label>
      <div class="category-picker" id="category-picker"></div>

      <div class="row-2">
        <div>
          <label for="event_date">Date</label>
          <input type="date" id="event_date" required>
        </div>
        <div>
          <label for="start_time">Start time</label>
          <input type="time" id="start_time" required>
        </div>
      </div>

      <label for="end_time">End time <span class="hint">(optional)</span></label>
      <input type="time" id="end_time">

      <label for="description">Description <span class="hint">(max 500 characters)</span></label>
      <textarea id="description" required maxlength="500"></textarea>
      <div class="char-count"><span id="char-count">0</span>/500</div>

      <label for="link">Link <span class="hint">(tickets, event page, etc. — optional)</span></label>
      <input type="url" id="link" placeholder="https://">

      <div class="checkbox-row">
        <input type="checkbox" id="is_free">
        <label for="is_free">This event is free</label>
      </div>

      <label for="submitter_name">Your name</label>
      <input type="text" id="submitter_name" required maxlength="80">

      <label for="submitter_email">Your email <span class="hint">(not published — for questions only)</span></label>
      <input type="email" id="submitter_email" required>

      <div class="submit-row">
        <button type="submit" class="btn btn-primary" id="submit-btn">Submit event</button>
      </div>

      <div class="form-message" id="form-message"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="categories.js"></script>
<script src="submit.js"></script>
</body>
</html>
